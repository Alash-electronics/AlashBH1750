sentence=Easy BH1750 light sensor library (GY-302): lux with automatic range from 0.1 to 100000 lx, plain-words description, no dependencies.
paragraph=Reads the BH1750 ambient light sensor over I2C with a one-line begin(): finds the address, picks the sensitivity by itself so the result is right in a dark room and in direct sun, tells the light level in words (dark, lit room, direct sunlight) and explains wiring problems in Russian, Kazakh or English. Needs only the built-in Wire library. Examples included, made for classes and kits by Alash Electronics.
